[project]
authors = [
    { name = "PRODDUTURU LIKITH KUMAR", email = "[likithkumar784@gmail.com]" }
]
name = "intelligent-rag-based-chatbot-for-mits-students"
version = "0.1.0"
description = "This chatbot is a AI-powered chatbot designed to help students with their academic and campus-life queries in MITS college"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.25.0",
    "psycopg[binary]>=3.2.0",
    "pymongo>=4.0.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.7.0",
    "google-generativeai>=0.3.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0"
]

[tool.vercel]
entrypoint = "Server/main.py:app"

