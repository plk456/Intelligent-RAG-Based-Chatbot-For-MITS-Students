            "httpMethod": "POST",
            "path": "762830e1-8bfa-4adb-b690-e22b687210da",
            "responseMode": "responseNode",
            "options": {}
          },
          "type": "n8n-nodes-base.webhook",
          "typeVersion": 2.1,
