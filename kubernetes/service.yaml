apiVersion: v1
kind: Service
metadata:
  name: mits-chatbot-frontend-service
spec:
  selector:
    app: mits-chatbot-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: mits-chatbot-backend-service
spec:
  selector:
    app: mits-chatbot-backend
  ports:
    - protocol: TCP
      port: 5678
      targetPort: 5678
  type: ClusterIP