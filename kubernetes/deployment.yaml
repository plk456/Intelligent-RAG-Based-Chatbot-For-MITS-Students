apiVersion: apps/v1
kind: Deployment
metadata:
  name: mits-chatbot-frontend
  labels:
    app: mits-chatbot-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mits-chatbot-frontend
  template:
    metadata:
      labels:
        app: mits-chatbot-frontend
    spec:
      containers:
      - name: frontend
        image: mits-chatbot-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mits-chatbot-backend
  labels:
    app: mits-chatbot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mits-chatbot-backend
  template:
    metadata:
      labels:
        app: mits-chatbot-backend
    spec:
      containers:
      - name: backend
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
        env:
        - name: N8N_PORT
          value: "5678"
        volumeMounts:
        - name: workflow-data
          mountPath: /home/node/.n8n
      volumes:
      - name: workflow-data
        configMap:
          name: n8n-workflow-data